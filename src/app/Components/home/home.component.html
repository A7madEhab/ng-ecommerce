<section class="py-4">
    <!-- row-cols-lg-5 creates exactly 5 items per row on large screens -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-6 g-3">

        @for (product of productList; track product._id) {
        <div class="col">
            <div class="card h-100 shadow-sm border-0 p-2">

                <!-- Product Image -->
                <div class="d-flex justify-content-center align-items-center" style="height: 180px;">
                    <img [src]="product.imageCover" [alt]="product.title" class="img-fluid h-100 object-fit-contain" />
                </div>

                <!-- Product Details -->
                <div class="card-body p-2 d-flex flex-column justify-content-between">
                    <div>
                        <span class="text-success small fw-bold d-block mb-1">
                            {{ product.category.name }}
                        </span>
                        <h6 class="card-title text-truncate mb-2" [title]="product.title">
                            {{ product.title }}
                        </h6>
                    </div>

                    <!-- Price & Rating -->
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="fw-bold small">{{ product.price }} EGP</span>
                        <span class="small text-muted">
                            <i class="fas fa-star text-warning me-1"></i>
                            {{ product.ratingsAverage }}
                        </span>
                    </div>
                </div>

            </div>
        </div>
        }

    </div>
</section>
